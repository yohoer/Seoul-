name: Fix shopping totals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shopping records and totals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/App.jsx')
          s = p.read_text()

          old_state = "const [shoppingList,setShoppingList]=useState(()=>JSON.parse(localStorage.getItem('seoul-shopping')||JSON.stringify([{id:1,item:'Olive Young 面膜',for:'自己',isBought:false},{id:2,item:'Tamburins 護手霜',for:'朋友A',isBought:false}])));"
          new_state = "const [shoppingList,setShoppingList]=useState(()=>{const raw=JSON.parse(localStorage.getItem('seoul-shopping')||JSON.stringify([{id:1,item:'Olive Young 面膜',for:'自己',amountKrw:0,isBought:false},{id:2,item:'Tamburins 護手霜',for:'朋友A',amountKrw:0,isBought:false}]));return raw.map(i=>({...i,amountKrw:Number(i.amountKrw)||0}))});"
          if old_state in s:
              s = s.replace(old_state, new_state)

          pattern = r" const renderShopping=\(\)=>\{.*?\};\n const renderChecklist"
          replacement = ''' const renderShopping=()=>{const totalKrw=shoppingList.reduce((sum,i)=>sum+Number(i.amountKrw||0),0);const boughtKrw=shoppingList.filter(i=>i.isBought).reduce((sum,i)=>sum+Number(i.amountKrw||0),0);const pendingKrw=totalKrw-boughtKrw;const add=()=>{if(!newShopItem.item)return;setShoppingList([...shoppingList,{...newShopItem,id:Date.now(),amountKrw:Number(newShopItem.amountKrw)||0,isBought:false}]);setNewShopItem({item:'',for:'',amountKrw:''})};const toggle=id=>setShoppingList(shoppingList.map(i=>i.id===id?{...i,isBought:!i.isBought}:i));return <div className='space-y-6 pb-24'><div className={`${theme.cardDark} rounded-2xl p-5 shadow-sm text-center`}><p className={`text-sm ${theme.textSub} font-medium`}>代購總額</p><h2 className={`text-3xl font-bold ${theme.textMain} my-1`}>₩ {totalKrw.toLocaleString()}</h2><p className={`text-sm ${theme.accent} font-bold`}>約 NT$ {Math.round(totalKrw/EXCHANGE_RATE).toLocaleString()}</p><div className='grid grid-cols-2 gap-2 mt-4'><div className='bg-white/70 rounded-xl p-2'><p className='text-[11px] text-gray-400'>已購</p><p className={`font-bold ${theme.textMain}`}>₩ {boughtKrw.toLocaleString()}</p></div><div className='bg-white/70 rounded-xl p-2'><p className='text-[11px] text-gray-400'>未購</p><p className={`font-bold ${theme.textMain}`}>₩ {pendingKrw.toLocaleString()}</p></div></div></div><div className={`${theme.card} rounded-2xl p-4 shadow-sm flex flex-col gap-3`}><input type='text' placeholder='要買什麼？' className='w-full bg-white rounded-xl px-4 py-3 text-sm' value={newShopItem.item} onChange={e=>setNewShopItem({...newShopItem,item:e.target.value})}/><div className='flex gap-2'><input type='text' placeholder='幫誰買？ (可留空)' className='flex-1 bg-white rounded-xl px-4 py-3 text-sm' value={newShopItem.for} onChange={e=>setNewShopItem({...newShopItem,for:e.target.value})}/><div className='relative flex-1'><span className='absolute left-3 top-3 text-gray-400 font-bold'>₩</span><input type='number' placeholder='金額' className='w-full bg-white rounded-xl pl-7 pr-3 py-3 text-sm' value={newShopItem.amountKrw} onChange={e=>setNewShopItem({...newShopItem,amountKrw:e.target.value})}/></div></div><button onClick={add} className={`${theme.primary} text-white py-3 rounded-xl font-bold`}><Plus className='w-5 h-5 inline mr-2'/>新增代購</button></div><div className='space-y-2'>{shoppingList.map(item=><div key={item.id} className={`bg-white rounded-xl p-4 shadow-sm flex items-center gap-3 border border-black/5 ${item.isBought?'opacity-60':''}`}><button onClick={()=>toggle(item.id)} className='shrink-0'>{item.isBought?<CheckCircle2 className={`w-6 h-6 ${theme.textPrimary}`}/>:<Circle className='w-6 h-6 text-gray-300'/>}</button><div className='flex-1 min-w-0'><p className={`font-medium ${theme.textMain} ${item.isBought?'line-through':''}`}>{item.item}</p>{item.for&&<p className={`text-xs ${theme.textSub}`}>幫 {item.for} 買</p>}</div><div className='text-right shrink-0'><p className={`font-bold ${theme.accent}`}>₩ {Number(item.amountKrw||0).toLocaleString()}</p><p className='text-[10px] text-gray-400'>NT$ {Math.round(Number(item.amountKrw||0)/EXCHANGE_RATE).toLocaleString()}</p></div><button onClick={()=>setShoppingList(shoppingList.filter(i=>i.id!==item.id))} className='text-gray-300 p-1'><Trash2 className='w-4 h-4'/></button></div>)}</div>{shoppingList.length===0&&<div className='text-center py-10'><HanokRoofIllustration strokeColor={theme.svgStroke}/><span className={`text-xs ${theme.textSub}`}>尚未新增代購項目</span></div>}</div>};
 const renderChecklist'''
          s2, n = re.subn(pattern, replacement, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'renderShopping patch expected 1 match, got {n}')
          s = s2

          old_input = "const [newShopItem,setNewShopItem]=useState({item:'',for:''});"
          new_input = "const [newShopItem,setNewShopItem]=useState({item:'',for:'',amountKrw:''});"
          s = s.replace(old_input, new_input)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add shopping amounts and totals"
            git push
          fi
